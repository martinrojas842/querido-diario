<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Entrada - Querido Diario</title>
    <!-- Enlace a Bootstrap CSS para un diseño responsivo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Enlace a la hoja de estilos personalizada -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-4">
        <!-- Encabezado con título de la vista y botones de navegación rápida -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Editar Entrada</h1>
            <div>
                <a href="/dashboard" class="btn btn-outline-secondary me-2">Inicio</a>
                <a href="/logout" class="btn btn-outline-danger">Cerrar Sesión</a>
            </div>
        </div>

        <!-- Bloque para mostrar mensajes Flash en caso de errores de validación al editar -->
        {% with messages = get_flashed_messages(category_filter=['entrada']) %}
            {% if messages %}
                <div class="alert alert-danger">
                    <ul>
                        {% for message in messages %}
                            <li>{{ message }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}
        {% endwith %}

        <!-- Formulario de actualización que envía los datos mediante POST a la ruta del controlador -->
        <form action="/actualizar/{{ entrada.id }}" method="POST">
            <!-- Campo para modificar la fecha de la entrada precargada -->
            <div class="mb-3">
                <label for="fecha" class="form-label">Fecha Entrada:</label>
                <input type="date" name="fecha" id="fecha" class="form-control" value="{{ entrada.fecha }}" required>
            </div>
            <!-- Área de texto para modificar el contenido de las notas con el valor actual precargado -->
            <div class="mb-3">
                <label for="notas" class="form-label">Notas:</label>
                <textarea name="notas" id="notas" rows="5" class="form-control" required>{{ entrada.notas }}</textarea>
            </div>
            <!-- Botón de envío para guardar los cambios en la base de datos -->
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </form>
    </div>
</body>
</html>
