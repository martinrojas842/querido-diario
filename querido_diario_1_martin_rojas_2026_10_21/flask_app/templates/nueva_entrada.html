<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Entrada - Querido Diario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Nueva Entrada</h1>
            <div>
                <a href="/dashboard" class="btn btn-outline-secondary me-2">Inicio</a>
                <a href="/logout" class="btn btn-outline-danger">Cerrar Sesión</a>
            </div>
        </div>

        <!-- Mensajes flash para errores de validación de la entrada -->
        {% with messages = get_flashed_messages(category_filter=['entrada']) %}
            {% if messages %}
                <div class="alert alert-danger">
                    <ul>
                        {% for message in messages %}
                            <li>{{ message }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}
        {% endwith %}

        <form action="/crear/entrada" method="POST">
            <div class="mb-3">
                <label for="fecha" class="form-label">Fecha Entrada:</label>
                <input type="date" name="fecha" id="fecha" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="notas" class="form-label">Notas:</label>
                <textarea name="notas" id="notas" rows="5" class="form-control" placeholder="Escribe tus notas aquí..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
    </div>
</body>
</html>
